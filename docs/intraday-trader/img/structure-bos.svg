<svg xmlns="http://www.w3.org/2000/svg" width="880" height="458" viewBox="0 0 880 458" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Swing points and a break of structure</title>
<desc id="d">Daily candles. A swing high forms at 607.50, the highest high of five candles. Price pulls back to a swing low at 599.80. A later candle spikes to 608.20 but closes at 606.60, below the swing high: a wick only, not a break. Two candles later a candle closes at 609.10, above 607.50: a break of structure, and the bias turns bullish.</desc>
