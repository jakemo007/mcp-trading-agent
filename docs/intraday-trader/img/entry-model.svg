<title id="t">The long entry model, step by step</title>
<desc id="d">A 5-minute candle chart of the worked example in section 9, drawn to scale. The opening range forms between 610.60 and 615.40. A swing high prints at 612.20 at 10:05. At 10:25 price dips to 609.95, under the previous day's low 610.20, and closes back above it. The 10:35 candle is large and closes at 613.30, above the swing high. The 10:40 candle leaves a fair value gap from 611.60 to 612.60. A buy limit at the midpoint 612.10 is filled at 10:50. The stop is 609.65 and the target is the previous day's high 618.90, 2.78 times the risk. The opening range high 615.40 is too close at 1.35 times the risk.</desc>
