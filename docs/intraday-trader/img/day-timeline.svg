<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The trading day as a timeline</title>
<desc id="d">A clock from 09:15 to 15:30 IST. 09:15 to 10:15 is watch only while the opening range forms and the first 1-hour candle completes. Volume scans run at 10:15, 11:15, 12:15 and 13:15. Entries are allowed from 10:15 to 14:30. No new entries after 14:30. Every open position is squared off at 15:15. The market closes at 15:30. At about 16:00 a GitHub Action replays the day and publishes the report.</desc>
<rect x="0.5" y="0.5" width="879" height="345" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24.0" y="36.0" font-size="17" fill="#e6edf3" font-weight="600">The trading day on the NSE clock (IST)</text>
<text x="24.0" y="58.0" font-size="13" fill="#9aa4af">The session is replayed after the close, one 5-minute candle at a time.</text>
<text x="280.0" y="88.0" font-size="12" fill="#9aa4af" text-anchor="middle">Volume scan checkpoints: which stocks are in play?</text>
