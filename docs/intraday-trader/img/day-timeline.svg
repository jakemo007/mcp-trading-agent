<text x="60.0" y="240.0" font-size="12" fill="#9aa4af">09:15 to 10:15</text>
<text x="38.0" y="262.0" font-size="13" fill="#e6edf3" font-weight="600">Watch only</text>
<text x="38.0" y="280.0" font-size="12" fill="#9aa4af">Opening range forms; the</text>
<text x="38.0" y="296.0" font-size="12" fill="#9aa4af">first 1-hour candle closes.</text>
<rect x="235.0" y="216.0" width="199.0" height="106.0" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8"/>
