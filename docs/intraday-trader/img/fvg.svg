<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Bullish and bearish fair value gaps</title>
<desc id="d">Left: a bullish fair value gap. Candle 1 has a high of 611.60, candle 2 is a large up candle, candle 3 has a low of 612.60. The band from 611.60 to 612.60 is the gap and its midpoint 612.10 is the entry. Right: a bearish fair value gap. Candle 1 has a low of 1,483.50, candle 2 is a large down candle, candle 3 has a high of 1,482.10. The gap is 1,482.10 to 1,483.50 with midpoint 1,482.80.</desc>
<rect x="0.5" y="0.5" width="879" height="451" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24.0" y="36.0" font-size="17" fill="#e6edf3" font-weight="600">Fair value gaps: where price moved too fast</text>
<line x1="29.0" y1="49.0" x2="29.0" y2="65.0" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="25.0" y="52.0" width="8.0" height="10.0" fill="#0d1117" stroke="#c9d1d9" stroke-width="1.5"/>
<text x="41.0" y="62.0" font-size="12" fill="#9aa4af">up candle (hollow)</text>
<line x1="181.4" y1="49.0" x2="181.4" y2="65.0" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="177.4" y="52.0" width="8.0" height="10.0" fill="#c9d1d9" stroke="#c9d1d9" stroke-width="1.5"/>
<text x="193.4" y="62.0" font-size="12" fill="#9aa4af">down candle (filled)</text>
<rect x="341.4" y="51.0" width="22.0" height="13.0" fill="#2f81f7" fill-opacity="0.3" stroke="#2f81f7" stroke-width="1.2"/>
<text x="370.4" y="62.0" font-size="12" fill="#9aa4af">fair value gap</text>
<line x1="480.6" y1="58.0" x2="506.6" y2="58.0" stroke="#5fd8ee" stroke-width="2.5"/>
<text x="513.6" y="62.0" font-size="12" fill="#9aa4af">CE: midpoint of the gap, the entry price</text>
<rect x="24.0" y="80.0" width="404.0" height="348.0" fill="#161b22" stroke="#30363d" stroke-width="1" rx="10"/>
<text x="40.0" y="107.0" font-size="15" fill="#e6edf3" font-weight="600">Bullish FVG</text>
<text x="412.0" y="107.0" font-size="12" fill="#9aa4af" text-anchor="end">gap below price: support</text>
<rect x="68.0" y="231.0" width="344.0" height="55.0" fill="#2f81f7" fill-opacity="0.26" stroke="#2f81f7" stroke-width="1.2"/>
<line x1="102.0" y1="286.0" x2="102.0" y2="335.5" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="86.0" y="291.5" width="32.0" height="33.0" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
<line x1="170.0" y1="187.0" x2="170.0" y2="297.0" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="154.0" y="192.5" width="32.0" height="99.0" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
<line x1="238.0" y1="148.5" x2="238.0" y2="231.0" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="222.0" y="159.5" width="32.0" height="33.0" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
<line x1="68.0" y1="258.5" x2="412.0" y2="258.5" stroke="#5fd8ee" stroke-width="2.5"/>
<text x="264.0" y="223.0" font-size="12" xml:space="preserve"><tspan fill="#e6edf3" font-weight="600">612.60</tspan><tspan fill="#9aa4af">  low of candle 3</tspan></text>
<text x="264.0" y="303.0" font-size="12" xml:space="preserve"><tspan fill="#e6edf3" font-weight="600">611.60</tspan><tspan fill="#9aa4af">  high of candle 1</tspan></text>
<text x="264.0" y="251.5" font-size="12.5" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">CE 612.10</tspan><tspan fill="#e6edf3"> (entry)</tspan></text>
<text x="170.0" y="174.9" font-size="12" fill="#e6edf3" text-anchor="middle">large up candle</text>
<circle cx="102.0" cy="374.0" r="10" fill="none" stroke="#9aa4af" stroke-width="1.2"/>
<text x="102.0" y="378.3" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">1</text>
<circle cx="170.0" cy="374.0" r="10" fill="none" stroke="#9aa4af" stroke-width="1.2"/>
<text x="170.0" y="378.3" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">2</text>
<circle cx="238.0" cy="374.0" r="10" fill="none" stroke="#9aa4af" stroke-width="1.2"/>
<text x="238.0" y="378.3" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">3</text>
<text x="270.0" y="378.3" font-size="12" fill="#9aa4af">candle numbers</text>
<text x="40.0" y="406.0" font-size="12.5" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Rule: </tspan><tspan fill="#e6edf3">low of candle 3 above high of candle 1</tspan></text>
<text x="40.0" y="424.0" font-size="12" fill="#9aa4af">Gap 611.60 to 612.60.  CE = (611.60 + 612.60) / 2 = 612.10</text>
<rect x="452.0" y="80.0" width="404.0" height="348.0" fill="#161b22" stroke="#30363d" stroke-width="1" rx="10"/>
<text x="468.0" y="107.0" font-size="15" fill="#e6edf3" font-weight="600">Bearish FVG</text>
<text x="840.0" y="107.0" font-size="12" fill="#9aa4af" text-anchor="end">gap above price: resistance</text>
<rect x="496.0" y="221.7" width="344.0" height="40.5" fill="#2f81f7" fill-opacity="0.26" stroke="#2f81f7" stroke-width="1.2"/>
<line x1="530.0" y1="146.5" x2="530.0" y2="221.7" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="514.0" y="172.5" width="32.0" height="26.1" fill="#c9d1d9" stroke="#c9d1d9" stroke-width="1.5"/>
<line x1="598.0" y1="207.3" x2="598.0" y2="288.3" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="582.0" y="210.2" width="32.0" height="75.3" fill="#c9d1d9" stroke="#c9d1d9" stroke-width="1.5"/>
<line x1="666.0" y1="262.3" x2="666.0" y2="334.6" stroke="#c9d1d9" stroke-width="1.5"/>
<rect x="650.0" y="285.4" width="32.0" height="28.9" fill="#c9d1d9" stroke="#c9d1d9" stroke-width="1.5"/>
<line x1="496.0" y1="242.0" x2="840.0" y2="242.0" stroke="#5fd8ee" stroke-width="2.5"/>
<text x="692.0" y="213.7" font-size="12" xml:space="preserve"><tspan fill="#e6edf3" font-weight="600">1,483.50</tspan><tspan fill="#9aa4af">  low of candle 1</tspan></text>
<text x="692.0" y="279.3" font-size="12" xml:space="preserve"><tspan fill="#e6edf3" font-weight="600">1,482.10</tspan><tspan fill="#9aa4af">  high of candle 3</tspan></text>
<text x="692.0" y="235.0" font-size="12.5" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">CE 1,482.80</tspan><tspan fill="#e6edf3"> (entry)</tspan></text>
<text x="598.0" y="312.9" font-size="12" fill="#e6edf3" text-anchor="middle">large down candle</text>
<circle cx="530.0" cy="374.0" r="10" fill="none" stroke="#9aa4af" stroke-width="1.2"/>
<text x="530.0" y="378.3" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">1</text>
<circle cx="598.0" cy="374.0" r="10" fill="none" stroke="#9aa4af" stroke-width="1.2"/>
<text x="598.0" y="378.3" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">2</text>
<circle cx="666.0" cy="374.0" r="10" fill="none" stroke="#9aa4af" stroke-width="1.2"/>
<text x="666.0" y="378.3" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">3</text>
<text x="698.0" y="378.3" font-size="12" fill="#9aa4af">candle numbers</text>
<text x="468.0" y="406.0" font-size="12.5" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Rule: </tspan><tspan fill="#e6edf3">high of candle 3 below low of candle 1</tspan></text>
<text x="468.0" y="424.0" font-size="12" fill="#9aa4af">Gap 1,482.10 to 1,483.50.  CE = (1,482.10 + 1,483.50) / 2 = 1,482.80</text>
</svg>
