name: Swing Trader

on:
  schedule:
    # Daily scan — 09:25 IST = 03:55 UTC, Mon–Fri
    - cron: "55 3 * * 1-5"
    # Friday report — 15:15 IST = 09:45 UTC, Friday only
    - cron: "45 9 * * 5"
    # Exit check every 30 min — 09:30–16:00 IST = 04:00–10:30 UTC, Mon–Fri
    - cron: "*/30 4-10 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no positions written)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

# All jobs rewrite data/swing_portfolio.json — run one at a time so pushes never race
concurrency:
  group: swing-portfolio
  cancel-in-progress: false

jobs:
  # ── Intraday exit check (SL / target) ─────────────────────────────────────────
  exits:
    name: Exit Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && contains(github.event.schedule, '*/30')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Close positions at SL / target
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO)
          from swing_trader.runner import update_positions
          update_positions()
          "

      - name: Commit portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing_portfolio.json
          git diff --cached --quiet || git commit -m "chore: swing exit check $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Daily scan + position update ──────────────────────────────────────────────
  scan:
    name: Daily Scan
    runs-on: ubuntu-latest
    # Skip this job on the Friday report trigger (09:45 UTC)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '55 3'))

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO)
          from swing_trader.runner import run_daily_scan, update_positions
          dry = '${{ github.event.inputs.dry_run }}' == 'true'
          # Close SL/target hits first so freed slots and capital are available for new entries
          if not dry:
              update_positions()
          run_daily_scan(dry_run=dry)
          "

      - name: Commit portfolio state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing_portfolio.json
          git diff --cached --quiet || git commit -m "chore: swing portfolio update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Friday weekly report ──────────────────────────────────────────────────────
  report:
    name: Weekly Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && contains(github.event.schedule, '45 9')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # need full history to switch branches

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update positions before report
        run: |
          python -c "
          from swing_trader.runner import update_positions
          update_positions()
          "

      - name: Build HTML report
        run: |
          python -c "
          from datetime import date
          from swing_trader.portfolio import load
          from swing_trader.report import build_html, save_report
          state = load()
          html  = build_html(state)
          path  = save_report(html, f'SWING-WEEKLY-{date.today().isoformat()}.html')
          print(f'Report: {path}')
          "

      - name: Commit portfolio state and report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing_portfolio.json data/reports/
          git diff --cached --quiet || git commit -m "chore: swing portfolio update $(date -u +%Y-%m-%d)"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push report to reports branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch if it doesn't exist yet
          if git ls-remote --exit-code --heads origin reports; then
            git fetch origin reports
            git checkout reports
          else
            git checkout --orphan reports
            git rm -rf . --quiet
          fi

          # Copy reports from main's working state
          mkdir -p data/reports
          git checkout main -- data/reports/

          # Site root: index.html listing every weekly report, newest first
          {
            echo '<!doctype html><html><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Swing Trader Reports</title><style>'
            echo 'body{background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}'
            echo 'a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}'
            echo 'li{padding:8px 0;border-bottom:1px solid #21262d;list-style:none}ul{padding:0}'
            echo '.latest{display:inline-block;margin:8px 0 24px;padding:10px 16px;background:#238636;color:#fff;border-radius:6px}'
            echo '</style></head><body><h1>Swing Trader — Weekly Reports</h1>'
            LATEST=$(ls data/reports/SWING-WEEKLY-*.html 2>/dev/null | sort -r | head -1)
            [ -n "$LATEST" ] && echo "<a class=\"latest\" href=\"$LATEST\">Open latest report →</a>"
            echo '<ul>'
            for f in $(ls data/reports/SWING-WEEKLY-*.html 2>/dev/null | sort -r); do
              d=$(basename "$f" .html | sed 's/SWING-WEEKLY-//')
              echo "<li><a href=\"$f\">Week ending $d</a></li>"
            done
            echo '</ul></body></html>'
          } > index.html
          touch .nojekyll

          git add data/reports/ index.html .nojekyll
          git diff --cached --quiet || git commit -m "report: weekly P&L $(date -u +%Y-%m-%d)"
          git push origin reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print report URL
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          echo "Reports site : https://${OWNER}.github.io/${NAME}/"
          echo "This week    : https://${OWNER}.github.io/${NAME}/data/reports/SWING-WEEKLY-$(date -u +%Y-%m-%d).html"
